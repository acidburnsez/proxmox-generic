---
- name: Provision Infrastructure via Scripts (Legacy Migration)
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Ensure target is reachable
      ping:

    - name: Execute legacy setup script
      script: "../terraform/scripts/{{ setup_script }}"
      when: setup_script is defined
      register: script_output

    - name: Show script output
      debug:
        var: script_output.stdout_lines
      when: script_output.changed
