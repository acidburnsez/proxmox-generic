apiVersion: v1
kind: Secret
metadata:
  name: gitea-proxmox-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: http://192.168.11.69:3000/yourgithubusername/proxmox.git
  password: YOUR_GITEA_TOKEN
  username: user
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.11.69:3000/yourgithubusername/proxmox.git
    targetRevision: feature/wazuh-api-route
    path: kubernetes/authelia
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
