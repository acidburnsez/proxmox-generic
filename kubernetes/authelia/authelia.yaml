apiVersion: v1
kind: Namespace
metadata:
  name: authelia
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-pvc
  namespace: authelia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
  labels:
    app: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      containers:
      - name: authelia
        image: authelia/authelia:4.39.20
        command:
        - authelia
        args:
        - --config
        - /var/lib/authelia/configuration.yml
        ports:
        - containerPort: 9091
          name: http
        volumeMounts:
        - name: data-volume
          mountPath: /var/lib/authelia
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: authelia-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: authelia-service
  namespace: authelia
spec:
  type: LoadBalancer
  ports:
  - port: 9091
    targetPort: 9091
    protocol: TCP
    name: http
  selector:
    app: authelia
