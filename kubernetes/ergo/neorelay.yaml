# Declarative Kubernetes Manifests for NeoRelay Stack (00secChat)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neobear-nfs-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadOnlyMany
  nfs:
    server: 192.168.11.110
    path: /mnt/media/neobear/html
  mountOptions:
    - nolock
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neobear-nfs-pvc
  namespace: irc
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: neobear-nfs-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neodrop-data-pvc
  namespace: irc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neoguard-data-pvc
  namespace: irc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: neorelay-secrets
  namespace: irc
type: Opaque
stringData:
