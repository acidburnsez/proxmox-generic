    99eb65faae58c7bc92be7cc4306f02196050287e80014b2904f6398113fc0fe2
  neoguard_key: |
    f76b1b0daed59f14ee607ab94e4a89083c6858d19e576927b189ee4b2328ad20
  catalog_key: |
    784290709276f38809bb036cb13150acd9b6891473072a82f74c5dd086b095a3
  manager_token: |
    89a0bff3489ab4291f5f8222648ba1ee2a69296a91167c56
