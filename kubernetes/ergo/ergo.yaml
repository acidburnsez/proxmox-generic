apiVersion: v1
kind: ConfigMap
metadata:
  name: ergo-config
  namespace: irc
data:
  ircd.yaml: |
    network:
      name: HomeNet

    server:
      name: irc.example.com
      listeners:
        ":6667": {}
        ":6697":
          tls:
            cert: /ircd/certs/tls.crt
            key:  /ircd/certs/tls.key
      motd: ""
      motd-formatting: true
      max-sendq: 16M
      relaymsg:
        enabled: false

    limits:
      nicklen: 32
      channellen: 64
      awaylen: 500
      kicklen: 1000
      topiclen: 1000

    datastore:
      path: /ircd/ircd.db

    accounts:
      authentication-enabled: true
      registration:
        enabled: true
        allow-before-connect: true
        throttling:
          enabled: false
        email-verification:
          enabled: false
      nick-reservation:
        enabled: true
        method: strict
      require-sasl:
        enabled: false

    channels:
      default-modes: +nt
      registration:
        enabled: true

    history:
      enabled: true
      channel-length: 1024
      client-length: 256
      autoresize-window: 3d
      autoreplay-on-join: 0
      chathistory-maxmessages: 1000
      retention:
        allow-individual-user-delete: true
        enable-account-indexing: true

    logging:
      - method: stderr
        level: warn
        type: "* -userinput -useroutput"

    debug:
      recover-from-errors: true

    oper-classes:
      admin:
        capabilities:
          - kill
          - ban
          - nofakelag
          - relaymsg
          - vhosts
          - sajoin
          - samode
          - snomasks
          - roleplay
          - rehash
          - accreg
          - chanreg
          - history
          - defcon
          - massmessage

    opers:
      admin:
        class: admin
        password: "$2a$04$t23QhxOk1luMA8KyFeq1ROmZ9oLqx.fHVN6qPxEElBM0d47qE6Thy" # bcrypt hash for default testing password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ergo-data-pvc
  namespace: irc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ergo
  namespace: irc
  labels:
    app: ergo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ergo
  template:
    metadata:
      labels:
        app: ergo
    spec:
      containers:
      - name: ergo
        image: ghcr.io/ergochat/ergo:latest
        ports:
        - containerPort: 6667
          name: irc-plain
        - containerPort: 6697
          name: irc-tls
        volumeMounts:
        - name: config-volume
          mountPath: /ircd/ircd.yaml
          subPath: ircd.yaml
        - name: tls-volume
          mountPath: /ircd/certs
        - name: data-volume
          mountPath: /ircd
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "50m"
            memory: "128Mi"
      volumes:
      - name: config-volume
        configMap:
          name: ergo-config
      - name: tls-volume
        secret:
          secretName: ergo-tls
      - name: data-volume
        persistentVolumeClaim:
          claimName: ergo-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ergo-service
  namespace: irc
spec:
  type: LoadBalancer
  ports:
  - port: 6667
    targetPort: 6667
    protocol: TCP
    name: irc-plain
  - port: 6697
    targetPort: 6697
    protocol: TCP
    name: irc-tls
  selector:
    app: ergo
