apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata
  namespace: monitoring
  labels:
    app: suricata
spec:
  selector:
    matchLabels:
      app: suricata
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: suricata
    spec:
      # Enable host networking to inspect node-level traffic
      hostNetwork: true
      tolerations:
        # Tolerate control plane nodes so Suricata runs across the entire K3s cluster
        - effect: NoSchedule
          operator: Exists
      containers:
      - name: suricata
        image: jasonish/suricata:latest
        securityContext:
          # Required to sniff traffic on the host interfaces
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
              - SYS_NICE
        command: ["suricata"]
        args:
          - "-i"
          - "eth0" # Adjust this to "any" or the specific node interface if eth0 is not the primary interface
          - "-c"
          - "/etc/suricata/suricata.yaml"
        volumeMounts:
          - name: suricata-logs
            mountPath: /var/log/suricata
      volumes:
        - name: suricata-logs
          hostPath:
            # Output eve.json to the node's /var/log/suricata directory for Wazuh agent ingestion
            path: /var/log/suricata
            type: DirectoryOrCreate
